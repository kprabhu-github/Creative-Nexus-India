<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="15" fill="#fff" stroke="#e5e5e5" stroke-width="0.5"/>
  <!-- Simplified chameleon spiral in Indian flag colors -->
  <path d="M16 4 C10 4, 4 10, 4 16 C4 22, 10 28, 16 28 C22 28, 28 22, 28 16 C28 10, 22 4, 16 4Z" fill="none" stroke="#222" stroke-width="1.5"/>
  <!-- Orange top -->
  <path d="M8 10 Q12 4, 22 8" fill="none" stroke="#FF9933" stroke-width="3" stroke-linecap="round"/>
  <!-- Green bottom -->
  <path d="M8 22 Q12 28, 22 24" fill="none" stroke="#138808" stroke-width="3" stroke-linecap="round"/>
  <!-- Spiral eye -->
  <circle cx="18" cy="12" r="3" fill="none" stroke="#222" stroke-width="1.2"/>
  <circle cx="18" cy="12" r="1" fill="#222"/>
  <!-- Body spiral -->
  <path d="M12 20 Q8 16, 12 12 Q16 8, 20 12" fill="none" stroke="#222" stroke-width="1.2"/>
</svg>
